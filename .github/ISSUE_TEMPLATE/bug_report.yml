name: Bug report
description: Something isn't working
labels: ["kind/bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What's broken?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
