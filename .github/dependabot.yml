# Dependabot raises the pull request; CI decides whether it lands.
# Everything here is pinned to an exact version, which is the whole reason
# this works — a floating range drifts silently and there's nothing to raise
# a pull request about.
version: 2

updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 10
    commit-message:
      prefix: fix
      include: scope
    # TypeScript 7 is the Go-rewritten compiler with a different internal
    # API — tsup's rollup-plugin-dts and openapi-typescript's codegen both
    # crash on it (#76). Ignore until they catch up; drop this once a bump
    # to either builds clean against TS 7.
    ignore:
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
    groups:
      bun-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
      bun-dependencies-major:
        patterns: ["*"]
        update-types: [major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
      actions-major:
        patterns: ["*"]
        update-types: [major]
