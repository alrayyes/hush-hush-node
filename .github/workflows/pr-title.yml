# commitlint checks individual commit messages inside a pull request; it
# never sees the pull request title. On a squash merge, GitHub defaults the
# squash commit message to that title, and release-please reads that landed
# message to decide the next version — so this is the check standing between
# a badly titled pull request and a bad message on main.
name: pr-title

on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize]

permissions:
  pull-requests: read
  statuses: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            style
            test
