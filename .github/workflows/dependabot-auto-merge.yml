# Dependabot has no built-in `automerge: true` the way Renovate does. This is
# that mechanism for a GitHub-primary repo: arm auto-merge the same way a
# human would from the UI, then let GitHub wait for the same checks every
# other pull request waits for.
#
# Every Dependabot PR gets this, not just patch/minor — GitHub's own
# auto-merge only ever completes a merge once checks are green, so a major
# bump that breaks CI just sits armed-but-blocked rather than merging
# broken. Per the standing CLAUDE.md exception ("merge one yourself once
# every check is green, no separate ask"), there's no separate gate on
# update-type layered on top of the green-check gate.
name: dependabot-auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      - run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
