# Regenerates the client whenever hush-hush's spec moves, and opens a pull
# request with the result — never pushes directly to main, and never
# auto-merges it either. See design.md's "Versioning via spec diff" and
# "Merge policy" decisions.
#
# oasdiff classifies the spec change as additive or breaking; that
# classification becomes the commit/PR message's Conventional Commits bump
# marker (fix: vs fix!: + BREAKING CHANGE:), so release-please computes the
# right semver bump from a message a human never had to write, and stays
# visible in the PR body for review either way. A regeneration PR gets real
# review before merge regardless of that classification
# (rules/sdk-generation.md) — a session-scoped auto-merge grant this repo
# was originally built under doesn't carry forward into permanent CI
# behavior (CLAUDE.md's own scoping rule for a grant like that).
name: codegen

on:
  schedule:
    - cron: "0 6 * * *" # daily, 06:00 UTC
  workflow_dispatch:
  repository_dispatch:
    types: [spec-updated]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: codegen
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Record the spec commit this repo was last generated from
        id: before
        run: echo "sha=$(git -C hush-hush rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Pull hush-hush's latest spec
        run: git submodule update --remote hush-hush

      - name: Check whether the spec actually moved
        id: moved
        run: |
          after=$(git -C hush-hush rev-parse HEAD)
          if [ "$after" = "${{ steps.before.outputs.sha }}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "sha=$after" >> "$GITHUB_OUTPUT"
          fi

      - name: Install oasdiff
        if: steps.moved.outputs.changed == 'true'
        # go install alone doesn't put it on PATH for the next step - a
        # plain `run:` is a fresh non-login shell each time, and this
        # runner's preinstalled Go was never set up via actions/setup-go
        # (this job installs Node, not Go), which is what would normally
        # add $(go env GOPATH)/bin itself. Same bug hush-hush-python
        # found and fixed (PR #13): the classify step's `oasdiff` call
        # fails with "command not found", and its own error handling
        # (any non-zero exit from `oasdiff breaking` counts as breaking)
        # mislabels every regeneration as breaking regardless of the
        # real spec diff - confirmed live on PR #36 here.
        run: |
          go install github.com/oasdiff/oasdiff@v1.11.6
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Classify the spec change
        if: steps.moved.outputs.changed == 'true'
        id: classify
        run: |
          git -C hush-hush show "${{ steps.before.outputs.sha }}:api/openapi.yaml" > /tmp/before.yaml
          if oasdiff breaking /tmp/before.yaml hush-hush/api/openapi.yaml --fail-on ERR > /tmp/breaking.txt 2>&1; then
            echo "breaking=false" >> "$GITHUB_OUTPUT"
          else
            echo "breaking=true" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "report<<EOF"
            cat /tmp/breaking.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Regenerate the client
        if: steps.moved.outputs.changed == 'true'
        run: |
          npm ci
          ./scripts/generate.sh

      - name: Build commit message
        if: steps.moved.outputs.changed == 'true'
        id: message
        run: |
          if [ "${{ steps.classify.outputs.breaking }}" = "true" ]; then
            {
              echo "title=fix!: regenerate client from updated hush-hush spec"
              echo "body<<EOF"
              echo "BREAKING CHANGE: hush-hush's spec changed in a way oasdiff classifies as breaking."
              echo
              echo '```'
              echo "${{ steps.classify.outputs.report }}"
              echo '```'
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "title=fix: regenerate client from updated hush-hush spec"
              echo "body=oasdiff classifies this spec change as additive/non-breaking."
            } >> "$GITHUB_OUTPUT"
          fi

      # RELEASE_TOKEN, not the default GITHUB_TOKEN: a PR authored by
      # GITHUB_TOKEN sits at action_required with zero jobs run on every
      # workflow triggered against it -- ci.yml included, so a human
      # reviewing this regeneration has no CI signal at all until someone
      # clicks "Approve and run". RELEASE_TOKEN authors it as a real
      # collaborator instead, so checks actually run; this doesn't change
      # this job's own no-auto-merge-without-review policy, only whether
      # a reviewer can see real CI results.
      - name: Open pull request
        if: steps.moved.outputs.changed == 'true'
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          commit-message: ${{ steps.message.outputs.title }}
          title: ${{ steps.message.outputs.title }}
          body: ${{ steps.message.outputs.body }}
          branch: codegen/regenerate
          labels: codegen
