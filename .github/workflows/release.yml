# Nobody picks a version by hand for hand-written-code changes:
# release-please reads Conventional Commits on main and keeps a release pull
# request open with the next version and changelog entry. For a
# regeneration pull request specifically, the commit message's bump marker
# is set by codegen.yml from the oasdiff classification, not written by
# a person — see design.md's "Versioning via spec diff" decision.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    # wretry.action repackages the wrapped action's own outputs into one
    # JSON blob at steps.release.outputs.outputs, rather than passing each
    # one through under its own name - fromJSON unpacks it back out.
    outputs:
      release_created: ${{ fromJSON(steps.release.outputs.outputs).release_created }}
      tag_name: ${{ fromJSON(steps.release.outputs.outputs).tag_name }}
    steps:
      # release-please-action is a `uses:` step, so nick-fields/retry (which
      # only runs a shell command) can't wrap it directly — wretry.action
      # wraps another action's own uses:/with: instead. Retries a secondary
      # GitHub API rate limit / abuse-detection response, which clears
      # itself within seconds and has nothing to do with the token's hourly
      # quota genuinely running out (rules/releases.md's "Retry a release
      # job through GitHub's transient rate limit").
      - uses: Wandalen/wretry.action@e68c23e6309f2871ca8ae4763e7629b9c258e1ea # v3.8.0
        id: release
        with:
          action: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
          with: |
            token: ${{ secrets.RELEASE_TOKEN }}
            config-file: release-please-config.json
            manifest-file: .release-please-manifest.json
          attempt_limit: 3
          attempt_delay: 30000

  # npm Trusted Publishing: no NPM_TOKEN to hold or rotate. npmjs.com has a
  # trusted publisher configured for @hush-hush/sdk pointing at this exact
  # workflow; npm CLI >=11.5.0 exchanges the id-token below for a short-lived
  # publish credential on its own. See rules/releases.md's provenance section
  # — same keyless, OIDC-issued shape as `npm publish --provenance` itself.
  #
  # Not also publishing to GitHub Packages: its npm registry requires a
  # scoped package name matching the repo owner (@alrayyes/...), which would
  # mean publishing under a different name than the real npmjs.com package.
  publish-npm:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          submodules: recursive
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build
      # Trusted Publishing's OIDC exchange is npm CLI >=11.5.0's own feature
      # (see the comment above) - bun doesn't implement it, so this one step
      # still goes through a real npm install.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@12.0.2
      - run: npm publish --provenance
