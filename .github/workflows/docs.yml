# Builds the API reference from TSDoc comments and publishes it to GitHub
# Pages. Separate from ci.yml's own jobs since this deploys something
# (a live site), not just checks a diff.
#
# Also runs on pull_request (build only, deploy stays push-to-main-only) so a
# change that breaks typedoc fails its own checks instead of only failing the
# push to main after it has merged. hush-hush-php does the same.
name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run docs
      # TypeDoc has no option to copy an arbitrary static file into its
      # output root (checked its full --help against 0.28: --customCss/
      # --customJs/--favicon/--cname each target one specific asset, and
      # --projectDocuments renders markdown into an HTML page rather than
      # copying it verbatim) — so llms.txt is copied in here instead.
      - run: cp llms.txt site/llms.txt
      # Test and coverage reports for apis.ryankes.eu. A deploy replaces the
      # whole site, so every push to main builds them here, in the job that
      # assembles the site: a red test fails the job and nothing deploys.
      # Pull requests skip this, ci.yml already runs the tests there.
      #
      # Left out: the contract job (needs a Prism container, so it stays in
      # ci.yml) and the e2e smoke tests (nightly, against a staging server).
      - name: Run the tests for the reports
        if: github.event_name == 'push'
        run: |
          bun run test --reporter=default --reporter=junit --outputFile=reports/unit.xml
          bun run test:pact --reporter=default --reporter=junit --outputFile=reports/pact.xml
      - name: Stage the reports
        if: github.event_name == 'push'
        run: |
          mkdir -p site/reports/tests site/reports/coverage
          cp reports/unit.xml reports/pact.xml site/reports/tests/
          cp -r coverage/. site/reports/coverage/
          mv site/reports/coverage/cobertura-coverage.xml site/reports/coverage/coverage.xml
          cp scripts/reports-index.html site/reports/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
