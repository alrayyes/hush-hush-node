# The gate. Every command in here has a twin in lefthook.yml, so a green
# pre-commit means a green pipeline and neither can drift into being the only
# place a rule is enforced.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - run: bunx biome check .

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      # --reporter=junit (alongside the default reporter) feeds Codecov
      # Test Analytics below and the published reports.
      - name: vitest (hand-written layer only; see design.md's testing layers)
        run: bunx vitest run test/unit --coverage --reporter=default --reporter=junit --outputFile=reports/unit.xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          # A Dependabot PR doesn't get repo secrets by default (GitHub's
          # own restriction, not a misconfiguration here) - CODECOV_TOKEN
          # is empty on that run, and this repo's branch protection makes
          # Codecov refuse a tokenless upload ("Token required because
          # branch is protected"). That's an upload hiccup on an
          # unprivileged run, not a real test regression - true here
          # would fail every Dependabot PR's CI on that basis alone
          # (confirmed on the sibling hush-hush-php repo's PRs #13/#14,
          # where the tests themselves passed clean).
          fail_ci_if_error: false
      # Test Analytics: per-test failure/flake detail, not just a coverage
      # delta. !cancelled(), not the step default - this still runs when
      # vitest above failed (junit.xml exists either way), but not if the
      # whole run was cancelled out from under it.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: reports/unit.xml
          fail_ci_if_error: false
      # The Pages job publishes these. They upload on pull requests too, so
      # its assembly runs there and a broken step fails before the merge.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-results
          path: reports/unit.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      # The ignore list lives in the `audit` script in package.json.
      # GHSA-vfj7-8cjw-p6xm (braces) is ignored there: no patched release
      # exists (the range is <= 3.0.3, the latest), and the only path is
      # markdownlint-cli2 > micromatch, which globs this repo's own fixed
      # patterns in dev tooling that doesn't ship. Remove the flag once braces
      # has a fix (alrayyes/hush-hush-node#196).
      - run: bun run audit

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build

  # Proves the generated types file wasn't hand-edited: regenerating from the
  # pinned submodule commit must produce a byte-identical file. See
  # design.md's "Generated/hand-written boundary" decision.
  codegen-drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: ./scripts/generate.sh
      - run: git diff --exit-code src/generated

  markdown:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: bun.lock stays at lockfileVersion 1 (Dependabot can't parse 2 - see #62)
        run: |
          grep -q '"lockfileVersion": 1,' bun.lock
      - name: prettier --check
        run: bun run format:check
      - name: markdownlint
        run: bun run lint:md

  # Mechanics: grammar, spelling, the phonetic article. A right answer, so
  # this one gates rather than advises.
  grammar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: ghcr.io/alrayyes/ltex-cli-plus:18.7.0@sha256:22452e86a130e528d526b60792926002983fcbf732bff09bd4e843d22816e4ea
      options: --entrypoint ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./scripts/lint-ltex.sh

  # Style: house voice, weasel words, corporate speak. Advice rather than a
  # verdict - MinAlertLevel in .vale.ini prints it, and only Vale.Terms
  # takes the job down.
  style:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./scripts/lint-vale.sh

  # Contract-test the client against a mock server built from the same pinned
  # spec, per rules/sdk-generation.md's "testing against the spec, not a
  # hand-written stub".
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Start Prism mock from the pinned spec
        run: |
          docker run -d --name prism -p 4010:4010 \
            -v "$(pwd)/hush-hush/api:/spec:ro" \
            stoplight/prism:5@sha256:3f6d29e31bfe0b99587f0f6f79c423858dd6a2ea7e1e4658273ed930a78a9acf mock -h 0.0.0.0 -m false /spec/openapi.yaml
          # -m false: Prism's default multiprocess (Node cluster) mode
          # crashes on startup in this image — see hush-hush-go's CLAUDE.md
          # for the reproduction.
          for _ in $(seq 1 30); do
            curl -sf http://localhost:4010 >/dev/null 2>&1 && break
            sleep 1
          done
      - name: Run contract tests against the mock
        run: bun run test:contract
        env:
          HUSH_HUSH_BASE_URL: http://localhost:4010
      - name: Prism logs
        if: failure()
        run: docker logs prism

  # Records the client's real interactions as a Pact consumer contract.
  # Provider verification against hush-hush's actual server has to run in
  # hush-hush's own CI (see design.md's Risks — an external dependency this
  # repo can't wire up unilaterally); this job's job is only to keep
  # producing an up-to-date pact file for that to consume.
  pact-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run test:pact --reporter=default --reporter=junit --outputFile=reports/pact.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hush-hush-node-pact
          path: pact/pacts/*.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pact-test-results
          path: reports/pact.xml

  # The one Pages job: the API reference plus the test and coverage reports
  # for apis.ryankes.eu, assembled into one site/. A deploy replaces the whole
  # site, so this runs on every push to main whatever changed, and `needs`
  # every other job so a red run publishes nothing. On a pull request it
  # assembles the site and stops, so a broken step fails before the merge.
  # Left out of the reports: the contract job (needs a Prism container) and
  # the e2e smoke tests (nightly, against a staging server).
  pages:
    needs:
      - actionlint
      - lint
      - test
      - audit
      - build
      - codegen-drift
      - markdown
      - grammar
      - style
      - contract
      - pact-consumer
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run docs
      # TypeDoc has no option to copy an arbitrary static file into its
      # output root (checked its full --help against 0.28: --customCss/
      # --customJs/--favicon/--cname each target one specific asset, and
      # --projectDocuments renders markdown into an HTML page rather than
      # copying it verbatim) - so llms.txt is copied in here instead.
      - run: cp llms.txt site/llms.txt
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unit-test-results
          path: site/reports/tests
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pact-test-results
          path: site/reports/tests
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage
          path: site/reports/coverage
      - name: Assemble the reports
        run: |
          mv site/reports/coverage/cobertura-coverage.xml site/reports/coverage/coverage.xml
          cp scripts/reports-index.html site/reports/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name == 'push'
        with:
          path: site

  # Its own job so the github-pages environment, limited to main, never
  # blocks a pull request's run.
  deploy:
    if: github.event_name == 'push'
    needs: pages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      # The deploy succeeds even when the site serves a 404, so fetch the
      # real file. The retries cover the CDN catching up.
      - name: Check the live coverage report
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --location --retry 6 --retry-delay 10 \
            --retry-all-errors --output coverage.xml \
            "${PAGE_URL%/}/reports/coverage/coverage.xml"
          grep -q '<coverage ' coverage.xml

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: commitlint
        run: |
          bunx commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose
