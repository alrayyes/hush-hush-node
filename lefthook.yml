# The same commands CI runs, so the two cannot drift. The hook catches it
# early; CI is the gate that cannot be skipped.

pre-commit:
  jobs:
    - name: biome
      glob: "*.{js,mjs,cjs,ts,mts,cts,json}"
      run: npx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    - name: prettier
      glob: "*.{md,yml,yaml}"
      run: npx prettier --write {staged_files}
      stage_fixed: true

    - name: markdownlint
      glob: "*.md"
      run: npx markdownlint-cli2 {staged_files}

    - name: sort-package-json
      glob: "package.json"
      run: npx sort-package-json {staged_files}
      stage_fixed: true

    - name: actionlint
      glob: ".github/workflows/*.{yml,yaml}"
      run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

commit-msg:
  jobs:
    - name: commitlint
      run: npx commitlint --edit {1}

pre-push:
  parallel: true
  jobs:
    - name: typecheck
      run: npm run typecheck

    - name: test
      run: npm test

    - name: biome
      run: npx biome check .

    - name: format:check
      run: npm run format:check

    - name: lint:md
      run: npm run lint:md
