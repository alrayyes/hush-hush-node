# The same commands CI runs, so the two cannot drift. The hook catches it
# early; CI is the gate that cannot be skipped.

# Silent on a clean run, full detail on a failure. lefthook's default prints a
# banner and a line per job, which is noise to a person and pure token cost once
# a hook's output lands in an agent's tool result (rules/linting.md).
output:
  - failure

pre-commit:
  jobs:
    - name: biome
      glob: "*.{js,mjs,cjs,ts,mts,cts,json}"
      run: bunx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    - name: prettier
      glob: "*.{md,yml,yaml}"
      run: bunx prettier --write {staged_files}
      stage_fixed: true

    - name: markdownlint
      glob: "*.md"
      run: bunx markdownlint-cli2 {staged_files}

    - name: vale
      glob: "*.md"
      run: ./scripts/lint-vale.sh

    - name: sort-package-json
      glob: "package.json"
      run: bunx sort-package-json {staged_files}
      stage_fixed: true

    - name: actionlint
      glob: ".github/workflows/*.{yml,yaml}"
      run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

commit-msg:
  jobs:
    - name: commitlint
      run: bunx commitlint --edit {1}

pre-push:
  parallel: true
  jobs:
    - name: typecheck
      run: bun run typecheck

    - name: test
      run: bun run test

    - name: biome
      run: bunx biome check .

    - name: format:check
      run: bun run format:check

    - name: lint:md
      run: bun run lint:md

    - name: sort-package-json
      run: bun run sort-package-json:check

    - name: vale
      run: ./scripts/lint-vale.sh

    - name: ltex
      run: ./scripts/lint-ltex.sh
